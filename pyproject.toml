[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piip-example"
version = "0.1.0"
description = "Public PIIP consumer example: own spec plus URI-resolved public ontologies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "piip @ git+https://github.com/A-S-Consult-GmbH/PIIP_tooling.git@v0.1.3",
]

[tool.setuptools]
py-modules = ["run"]
